# -- Server ------------------------------------------------------------------
# Render injects PORT; fall back to 8080 locally
server.port=${PORT:8080}

# -- Watchmode API (Netflix shows - top-right quadrant) ----------------------
# Pass as:  WATCHMODE_API_KEY=<your-key>
# Do NOT hard-code the key here; keep this file in git.
watchmode.api.key=${WATCHMODE_API_KEY:}

# -- Wikipedia (trending articles - bottom-left quadrant) --------------------
# No API key required - uses the free Wikimedia REST API.

# -- Thymeleaf ----------------------------------------------------------------
spring.thymeleaf.cache=true

# -- Logging ------------------------------------------------------------------
logging.level.com.portal=INFO
